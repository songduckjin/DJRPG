name: Codex Task Runner

on:
  issues:
    types: [labeled]

# Only a trusted repository writer can add this label and start a run.
# The Codex action also enforces its own write-access check.
concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run_codex:
    if: github.event.label.name == 'codex-ready' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Validate task issue title
        id: task
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const match = title.match(/(?:작업|Task)\s*#?\s*(\d+)/i);
            if (!match) {
              core.setFailed("이슈 제목에 작업 번호가 필요합니다. 예: [작업 92] 아키텍처 진단");
              return;
            }
            core.setOutput("number", match[1]);

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate task document and create isolated branch
        id: branch
        env:
          TASK_NUMBER: ${{ steps.task.outputs.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TASK_FILE="docs/TASK_${TASK_NUMBER}.md"
          test -f "$TASK_FILE" || { echo "Missing task document: $TASK_FILE"; exit 1; }
          BRANCH="codex/task-${TASK_NUMBER}-issue-${ISSUE_NUMBER}"
          git switch -c "$BRANCH"
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Node and install project dependencies
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          output-file: codex-result.md
          prompt: |
            DJRPG 저장소에서 승인된 작업지시서를 실행한다.

            필수로 AGENTS.md, ${{ steps.branch.outputs.task_file }},
            docs/TASK.md를 읽고 작업 전 영향 범위를 분석한다.
            작업 번호: ${{ steps.task.outputs.number }}
            시작 요청 이슈: #${{ github.event.issue.number }}

            이슈에 codex-ready 라벨이 추가된 것은 해당 작업지시서의 범위를
            실행하도록 사용자가 승인했다는 뜻이다. 단, 작업지시서 자체에
            '사용자 세부 지시 대기', '승인 대기' 또는 이에 준하는 보류 문구가
            남아 있으면 실행하지 말고 필요한 승인/정보만 보고한다.

            AGENTS.md의 협업 규칙, 다른 작업자의 소유권, 데이터 계약 보호,
            개인/주의/핵심 공통 위험 분류를 반드시 지킨다.
            승인 범위 밖의 변경, 세이브/API/DB 계약 변경, main 직접 수정은 금지한다.
            현재 브랜치에서만 작업하고 커밋/푸시는 하지 않는다.
            가능한 범위에서 타입 검사, 테스트, 빌드를 실행한다.
            최종 결과를 codex-result.md에 요약하고 변경 파일, 검증 결과,
            남은 위험과 후속 조치도 포함한다.

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ steps.branch.outputs.branch }}
          delete-branch: false
          commit-message: "feat: complete Codex task ${{ steps.task.outputs.number }}"
          title: "Codex 작업 ${{ steps.task.outputs.number }} 결과"
          body: |
            ## Codex 자동 작업 결과

            - 작업 번호: ${{ steps.task.outputs.number }}
            - 작업지시서: ${{ steps.branch.outputs.task_file }}
            - 시작 이슈: #${{ github.event.issue.number }}

            Codex가 작업지시서와 AGENTS.md의 규칙에 따라 작성한 변경사항입니다.
            병합 전 담당자 검토, CI 통과 및 명시적 승인이 필요합니다.

      - name: Report result on the triggering issue
        if: always()
        uses: actions/github-script@v7
        env:
          TASK_NUMBER: ${{ steps.task.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          CODEX_MESSAGE: ${{ steps.codex.outputs.final-message }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const pr = process.env.PR_URL;
            const status = process.env.JOB_STATUS;
            const summary = process.env.CODEX_MESSAGE || "Codex 결과 메시지가 제공되지 않았습니다. Actions 로그를 확인하세요.";
            const body = pr
              ? `Codex 작업 실행이 끝났습니다.\n\n작업: ${process.env.TASK_NUMBER}\nPR: ${pr}\n\n${summary}`
              : `Codex 작업 실행 상태: ${status}\n\n${summary}\n\nPR이 생성되지 않았다면 Actions 실행 로그를 확인하세요.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
