<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DJRPG · 스킬 VFX 스튜디오</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #151116; color: #f2e8dc; font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 980px; margin: auto; padding: 16px; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 14px; color: #c7b9aa; }
      .layout { display: flex; align-items: flex-start; gap: 18px; }
      #stage { width: min(390px, 100%); aspect-ratio: 390 / 844; flex: none; overflow: hidden; background: #322a27; border: 1px solid #785d51; border-radius: 12px; }
      #stage canvas { display: block; }
      .controls { display: grid; gap: 12px; min-width: 210px; }
      label { display: grid; gap: 5px; color: #e0d2c2; }
      select, button { min-height: 42px; border: 1px solid #876c5b; border-radius: 8px; background: #2b2328; color: #fff; font: inherit; padding: 6px 10px; }
      button { background: #734331; font-weight: 700; cursor: pointer; }
      button:focus-visible, select:focus-visible { outline: 2px solid #ffc67a; outline-offset: 2px; }
      #status { min-height: 20px; color: #e6c393; }
      @media (max-width: 650px) { main { padding: 10px; } .layout { flex-direction: column; } #stage { align-self: center; } .controls { order: -1; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); } .controls label:first-child, #status { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main>
      <h1>스킬 VFX 스튜디오</h1>
      <p>실제 전투 엔진과 PixiJS 렌더러로 미리 봅니다. 저장·계정 연결은 하지 않습니다.</p>
      <div class="layout">
        <div id="stage" aria-label="390×844 모바일 전투 미리보기"></div>
        <div class="controls">
          <label>직업<select id="job"><option value="mage">마법사</option><option value="archer">궁수</option><option value="warrior">전사</option></select></label>
          <label>스킬<select id="skill"></select></label>
          <label>레벨<select id="level"><option>1</option><option>5</option><option>10</option></select></label>
          <label>대상 수<select id="targets"><option>1</option><option>3</option><option>8</option></select></label>
          <label>캐릭터<select id="gender"><option value="male">남성</option><option value="female">여성</option></select></label>
          <label>효과 품질<select id="quality"><option value="full">전체</option><option value="low">낮음</option></select></label>
          <button id="replay" type="button">다시 재생</button>
          <div id="status" role="status">리소스를 불러오는 중…</div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/dev/skillVfxStudio.ts"></script>
  </body>
</html>
