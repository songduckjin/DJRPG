<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJRPG 코스튬 뷰어</title><style>
body{margin:0;background:#17131b;color:#eee0c8;font:14px system-ui}main{max-width:880px;margin:auto;padding:18px}h1{font-size:22px}#stage{height:420px;border:1px solid #6e594b;background:radial-gradient(#3a3037,#17131b);touch-action:none}fieldset{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;border:1px solid #6e594b}label{display:flex;align-items:center;gap:5px}button,select,input{font:inherit}button,select{background:#342831;color:#eee0c8;border:1px solid #8e735d;padding:7px}input[type=range]{width:200px}output{min-width:2em}small{color:#b9aa9d}
</style></head><body><main><h1>코스튬 최소 뷰어</h1><p>본체 파츠(머리·몸통·팔·다리) · 갑옷 1종 · 손 앵커 무기</p><div id="stage"></div><fieldset><legend>걷기 8프레임</legend><button id="play">일시정지</button><label>프레임 <input id="frame" type="range" min="0" max="7" value="0"><output id="frame-value">0</output></label><label><input id="flip" type="checkbox">좌우 반전</label><label><input id="anchors" type="checkbox" checked>앵커 표시</label></fieldset><fieldset><legend>조합</legend><label>무기 <select id="weapon"><option value="one">한 손 검</option><option value="great">대검</option></select></label><label>동작 <select id="skill"><option value="walk">걷기</option><option value="slash">베기</option><option value="spin">회전</option><option value="smash">내려찍기</option><option value="cast">발동 자세</option></select></label><label>가림 방식 <select id="cover"><option value="hide">파츠 숨김</option><option value="replace">파츠 교체</option></select></label></fieldset><fieldset><legend>장비·레이어</legend><label><input id="armor" type="checkbox" checked>갑옷</label><label><input id="helmet" type="checkbox" checked>투구</label><label><input id="extras" type="checkbox" checked>망토·신발</label><label><input id="body" type="checkbox" checked>본체</label></fieldset><p id="metrics" aria-live="polite"></p><small>프로토타입 전용. 게임 렌더러·세이브에는 연결되지 않습니다.</small></main><script type="module" src="./main.ts"></script></body></html>
