<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DJRPG · 작업 237 검수(업그레이드 화살표)</title>
    <style>
      html, body { margin: 0; background: #0b090c; color: #e8dcc8; font: 13px/1.5 'Noto Sans KR', sans-serif; }
      .wrap { padding: 18px; display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
      .phone { width: 390px; height: 844px; border: 1px solid #4b3a30; border-radius: 14px; overflow: hidden; background: #100d10; }
      .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
      h1 { margin: 0 0 4px; font-size: 15px; }
      p { margin: 0; color: #a89a8b; font-size: 12px; }
    </style>
  </head>
  <body>
    <!-- 검수 전용 페이지(작업 237). 실제 빌드된 앱 번들·CSS를 그대로 띄우되 `/api/*`만 가짜 응답으로 바꾼다.
         레포에 남기지 않는다(검수 뒤 삭제). -->
    <script>
      const REVIEW = location.search.includes('frame=1');
      if (!REVIEW) {
        document.body.insertAdjacentHTML('beforeend', `<div class="wrap"><div><h1>작업 237 · 업그레이드 초록 화살표 검수</h1><p>390×844 · 실제 빌드 번들 + 가짜 API(가방 · 공용창고 · 거래소)</p></div><div class="phone"><iframe src="./review-237.html?frame=1"></iframe></div></div>`);
      } else {
        const now = Date.now();
        let seq = 0;
        const item = (name, slot, rarity, stats, plus = 0) => ({ id: `i${++seq}`, name, slot, rarity, stats, plus });
        // 내 캐릭터(전사): 무기·투구·갑옷·반지 두 칸 착용.
        const worn = {
          weapon: item('황혼의 클레이모어', 'weapon', 'rare', { attack: 60, health: 30, crit: 8 }),
          helmet: item('철제 바시넷', 'helmet', 'epic', { defense: 30, health: 40 }),
          armor: item('사슬 갑옷', 'armor', 'rare', { defense: 40, health: 40 }),
          ring1: item('은 반지', 'ring1', 'magic', { attack: 6 }),
          ring2: item('수호의 인장', 'ring2', 'rare', { attack: 14 })
        };
        const bag = [
          item('심연의 뿔투구', 'helmet', 'unique', { defense: 80, health: 90, crit: 12 }),   // ▲
          item('불멸의 각반', 'boots', 'legendary', { defense: 22, health: 60, crit: 6 }),     // ▲ (빈 칸)
          item('군주의 반지', 'ring2', 'epic', { attack: 20 }),                                // ▲ (약한 반지 6보다 셈)
          item('황혼의 사슬 코이프', 'helmet', 'rare', { defense: 30 }),                        // 같음
          item('가죽 두건', 'helmet', 'common', { defense: 4 }),                               // 약함
          item('구리 반지', 'ring1', 'common', { attack: 2 }),                                 // 약함
          item('패왕의 신궁', 'weapon', 'legendary', { attack: 260 }),                          // 궁수 전용
          item('대현자의 성지팡이', 'weapon', 'legendary', { attack: 250 }),                    // 마법사 전용
          { id: 'book1', name: '[스킬북] 회전참격', slot: 'skillbook', rarity: 'rare', kind: 'skillbook', skillId: 'spin', stats: {} }
        ];
        const warehouse = [
          item('패왕의 성검', 'weapon', 'legendary', { attack: 320, crit: 20 }),               // ▲
          item('미스릴 아머', 'armor', 'unique', { defense: 70, health: 120 }),                 // ▲
          item('징박힌 갑옷', 'armor', 'magic', { defense: 12 }),                               // 약함
          item('강철 합성궁', 'weapon', 'epic', { attack: 90 })                                 // 궁수 전용
        ];
        const listing = (it, price, mine = false) => ({ id: `L${++seq}`, sellerName: mine ? '검수용전사' : '황야의상인', item: it, price, state: 'active', createdAt: now - 3600000, expiresAt: now + 259200000, soldAt: null, mine, purchased: false });
        const listings = [
          listing(item('용살자의 대검', 'weapon', 'unique', { attack: 180, crit: 24 }), 42000),        // ▲
          listing(item('성기사 풀플레이트', 'armor', 'legendary', { defense: 88, health: 160 }), 71000), // ▲
          listing(item('낡은 부츠', 'boots', 'common', { defense: 2 }), 120),                          // 약함
          listing(item('폭풍의 성궁', 'weapon', 'legendary', { attack: 240 }), 55000),                  // 궁수 전용
          listing(item('가죽 조끼', 'armor', 'magic', { defense: 9 }), 800, true)                       // 내 매물·약함
        ];
        const inbox = [
          { id: `D${++seq}`, item: item('불멸의 왕관', 'helmet', 'legendary', { defense: 96, health: 180 }), gold: 0, reason: '구매품', createdAt: now - 600000 },
          { id: `D${++seq}`, item: item('천 장갑', 'gloves', 'common', { defense: 1 }), gold: 0, reason: '취소품', createdAt: now - 900000 }
        ];
        const save = {
          version: 1, name: '검수용전사', accountId: 'PREVIEW1', gender: 'male', job: 'warrior', auto: true, autoClimb: true,
          level: 18, exp: 4200, gold: 123456, floor: 8, maxFloor: 8, floorKills: 12, kills: 2400, bossKills: 8, playSeconds: 32000,
          salvageCount: 4, health: 1500, equipment: worn, equipmentCollection: [], bag, tutorial: 3, stones: 42, skillPoints: 0,
          lastActiveAt: now, learned: ['slash2', 'spin'], passives: [], quickSlots: ['slash2', 'spin', null],
          skillLevels: { slash2: 3, spin: 2 }, dungeonFloor: 0, dungeonClearAt: 0, bossRetryFloor: 0
        };
        let revision = 3;
        const json = payload => new Response(JSON.stringify(payload), { status: 200, headers: { 'content-type': 'application/json' } });
        const realFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const url = new URL(typeof input === 'string' ? input : input.url, location.href);
          if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
          let body = {};
          try { body = JSON.parse((init && init.body) || '{}'); } catch { /* 본문 없음 */ }
          if (url.pathname.startsWith('/api/account')) {
            if (body.action === 'save') { revision += 1; return json({ ok: true, save: body.save ?? save, revision, offlineSeconds: 0 }); }
            return json({ accountId: 'PREVIEW1', loginId: '게스트', gender: 'male', job: 'warrior', guest: true, token: 'preview-token', save, revision, characterSlot: 1, offlineSeconds: 0 });
          }
          if (url.pathname.startsWith('/api/market')) {
            if (body.action === 'recent-price') return json({ count: 0 });
            if (body.action === 'list') {
              const view = body.view ?? 'active';
              const data = { watched: [], listings: listings.slice(), inbox, seq: 7, total: listings.length, page: 0, myActive: 1, revision, rules: { fee: 5, maxListings: 30, durationHours: 72, maxPrice: 1000000000, minPrice: 1, pageSize: 20 } };
              if (view === 'inbox') data.listings = [];
              if (view === 'sold' || view === 'recent') data.listings = listings.map(entry => ({ ...entry, state: 'sold', soldAt: now - 7200000 }));
              if (view === 'mine') data.listings = listings.filter(entry => entry.mine);
              return json(data);
            }
            return json({ message: '검수용 가짜 거래소입니다.' });
          }
          if (url.pathname.startsWith('/api/warehouse')) return json({ items: warehouse });
          if (url.pathname.startsWith('/api/shop')) return json({ wallet: { diamonds: 0, maxSlots: 4 }, diamondPacks: [], packages: [] });
          return json({});
        };
        // 실제 배포 번들(해시 파일명)을 index.html에서 찾아 그대로 불러온다.
        window.addEventListener('DOMContentLoaded', async () => {
          const app = document.createElement('div'); app.id = 'app'; document.body.append(app);
          try {
            const html = await realFetch('./index.html?_' + Date.now(), { cache: 'no-store' }).then(response => response.text());
            // index.html이 들고 있는 실제 CSS·엔트리 번들(해시 파일명)을 그대로 쓴다 — 동적 import만 하면
            // Vite가 HTML 엔트리에 넣어 둔 CSS 링크가 빠져 스타일 없이 그려진다.
            for (const css of html.matchAll(/href="\.?\/?(assets\/[^"]+\.css)"/g)) {
              const link = document.createElement('link'); link.rel = 'stylesheet'; link.crossOrigin = 'anonymous'; link.href = './' + css[1]; document.head.append(link);
            }
            const match = html.match(/src="\.?\/?(assets\/[^"]+\.js)"/);
            if (!match) throw new Error('번들을 찾지 못했습니다.');
            await import('./' + match[1]);
          } catch (error) {
            document.body.insertAdjacentHTML('beforeend', `<pre style="color:#ff9a8a;padding:12px">${String(error)}</pre>`);
          }
        });
      }
    </script>
  </body>
</html>
